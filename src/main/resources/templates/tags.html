<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/touristguide.css}">
    <title>Tags</title>
</head>
<body>
<h2> Tivoli tags</h2>

<header class="site-header">
    <nav class="nav-shell" aria-label="Main navigation">
        <a class="brand" th:href="@{/}" aria-label="Tourist guide home">
            <span class="brand-mark">TG</span>
            <span>Tourist guide</span>
        </a>
        <div class="nav-links">
            <a class="nav-cta" th:href="@{/copenhagen}">Copenhagen</a>
            <a class="nav-cta" th:href="@{/attractions}">Zealand</a>
            <a class="nav-cta" th:href="@{/attractions}">Fyn</a>
            <a class="nav-cta" th:href="@{/attractions}">Jutland</a>
        </div>
    </nav>
</header>

<div>
    <form th:action="@{/{name}/tags(name=${attractions.name})}"
      th:object="${attractions}"
      method="get">
        <ul>
             <li th:each ="tag : ${attractions.tags}" th:text ="${tag}"></li>
        </ul>
    </form>
            <a th:href="@{/attractions}" class="???" > Back </a>
</div>

<footer class="site-footer">
    <div class="footer-shell">
        <div>
            <a class="brand footer-brand" th:href="@{/}">
                <span class="brand-mark">TG</span>
                <span>Tourist guide</span>
            </a>
            <p class="footer-note">A small guide for big days out.</p>
        </div>
        <span class="footer-year">&copy; 2026 Tourist Attraction in Denmark.</span>
        <div class="footer-contact">
            <span class="footer-label">Contact</span>
            <a href="mailto:hello@touristguide.example">hello@touristguide.example</a>
            <span>Copenhagen &middot; Denmark</span>
        </div>
    </div>
</footer>
</body>
</html>
