<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/touristguide.css}">
    <title>Tags</title>
</head>
<body>
<h2> Tivoli tags</h2>

<div th:replace="~{fragment.html :: header}"></div>

<div>
    <form th:action="@{/{name}/tags(name=${attractions.name})}"
      th:object="${attractions}"
      method="get">
        <ul>
             <li th:each ="tag : ${attractions.tags}" th:text ="${tag}"></li>
        </ul>
    </form>
            <a th:href="@{/attractions}" class="???" > Back </a>
</div>

<div th:replace="~{fragment.html :: footer}"></div>
</body>
</html>
